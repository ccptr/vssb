[package]
name = "vssl"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Embeddable rootless Linux sandbox: namespaces, Landlock, seccomp and cgroup limits, safe to start from any thread"
publish = false

[dependencies]
libc = "0.2.191"
# The systemd user manager's StartTransientUnit, without a subprocess.
ossteam-dbus = { path = "../../ossteam/crates/ossteam-dbus" }

[dev-dependencies]
ossteam-dbus = { path = "../../ossteam/crates/ossteam-dbus", features = ["test-bus"] }

[features]
default = ["proxy", "wayland"]
# Filtering HTTP(S) proxy that serves a listener handed out by the sandbox.
proxy = []
# Wayland security contexts (wp_security_context_manager_v1), host side.
wayland = []
