[package]
name = "vssb"
version = "0.1.0"
edition = "2024"
description = "Embeddable rootless Linux sandbox: namespaces, Landlock, seccomp and cgroup limits, safe to start from any thread"
publish = false

[dependencies]
libc = "0.2.191"

[features]
default = ["proxy"]
# Filtering HTTP(S) proxy that serves a listener handed out by the sandbox.
proxy = []
